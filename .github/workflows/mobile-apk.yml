name: Build mobile Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature-mobile-practice-pwa
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voice-pocket-debug-keystore-v1

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: |
          npm run prepare:web
          npx cap add android
          npx cap sync android

      - name: Patch Android permissions and version
        working-directory: mobile
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        working-directory: mobile
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/VoiceGardenPocket-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGardenPocket-${{ github.run_number }}-apk
          path: mobile/release/*.apk
          if-no-files-found: error
          retention-days: 30
